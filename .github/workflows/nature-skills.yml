name: Nature skills validation
on:
  push:
    paths:
      - 'nature/**'
      - 'skills/**'
      - 'package.json'
      - '.github/workflows/nature-skills.yml'
  pull_request:
    paths:
      - 'nature/**'
      - 'skills/**'
      - 'package.json'
      - '.github/workflows/nature-skills.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate recipes and transitions
        run: npm test
